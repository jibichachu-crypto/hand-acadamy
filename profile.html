<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none';
                 img-src 'self' data:;
                 style-src 'self';
                 script-src 'self';
                 base-uri 'none';
                 form-action 'none';
                 object-src 'none';
                 frame-ancestors 'none';
                 referrer no-referrer;">

  <meta http-equiv="X-Content-Type-Options"
        content="nosniff">

  <title>Profile — HAND IN HAND ACADEMY</title>

  <link rel="stylesheet"
        href="css/base.css">
</head>

<body class="dashboard">

<header class="dash-topbar">

  <a href="index.html"
     class="dash-brand">
    HAND IN HAND ACADEMY
  </a>

  <nav class="dash-nav">

    <a href="dashboard.html"
       class="dash-link">
      Dashboard
    </a>

    <a href="logout.html"
       class="dash-link">
      Logout
    </a>

  </nav>

</header>


<div class="dash-layout">

  <aside class="dash-sidebar">

    <div class="side-title">
      Main
    </div>

    <a href="dashboard.html"
       class="side-link">
      📊 Dashboard
    </a>

    <a href="my-courses.html"
       class="side-link">
      📚 My Courses
    </a>

    <a href="dashboard.html#certificates"
       class="side-link">
      🎓 Certificates
    </a>


    <div class="side-title">
      Account
    </div>

    <a href="profile.html"
       class="side-link active">
      👤 Profile
    </a>

    <a href="settings.html"
       class="side-link">
      ⚙ Settings
    </a>


    <div class="side-title">
      Support
    </div>

    <a href="index.html#contact"
       class="side-link">
      ✉ Contact
    </a>

    <a href="logout.html"
       class="side-link">
      🚪 Logout
    </a>

  </aside>


  <main class="dash-main">

    <div class="welcome">

      <h2>
        My Profile 👤
      </h2>

      <p>
        Manage your personal information and learning preferences
      </p>

    </div>


    <div class="profile-layout">


      <!-- Avatar Card -->

      <div class="profile-avatar-card">

        <div class="avatar-circle"
             id="avatarCircle">
          L
        </div>

        <h3 id="profileNameDisplay">
          Learner
        </h3>

        <p id="profileEmailDisplay">
          learner@example.com
        </p>


        <div class="profile-stats">

          <div class="p-stat">

            <span id="statCourses">
              0
            </span>

            <small>
              Courses
            </small>

          </div>


          <div class="p-stat">

            <span id="statApps">
              0
            </span>

            <small>
              Applications
            </small>

          </div>

        </div>

      </div>


      <!-- Profile Form -->

      <div class="profile-form-card">

        <h3 class="section-title">
          Personal Information
        </h3>


        <form id="profileForm"
              novalidate>


          <div class="form-row-grid">


            <div class="model-input-group">

              <label class="form-label"
                     for="pName">
                Full Name
              </label>

              <input
                type="text"
                id="pName"
                class="model-input"
                placeholder="Enter Your Name">

              <div
                class="model-error"
                id="pName-error">
              </div>

            </div>


            <div class="model-input-group">

              <label class="form-label"
                     for="pEmail">
                Email Address
              </label>

              <input
                type="email"
                id="pEmail"
                class="model-input"
                placeholder="Enter Email">

              <div
                class="model-error"
                id="pEmail-error">
              </div>

            </div>

          </div>


          <div class="form-row-grid">


            <div class="model-input-group">

              <label class="form-label"
                     for="pPhone">
                Phone Number
              </label>


              <div class="phone-group"
                   id="pPhoneGroup">

                <select
                  id="pCountryCode"
                  class="country-select"
                  aria-label="Country code">

                  <option value="+91">
                    🇮🇳 +91
                  </option>

                  <option value="+1">
                    🇺🇸 +1
                  </option>

                  <option value="+44">
                    🇬🇧 +44
                  </option>

                  <option value="+971">
                    🇦🇪 +971
                  </option>

                  <option value="+966">
                    🇸🇦 +966
                  </option>

                </select>


                <input
                  type="tel"
                  id="pPhone"
                  class="phone-input"
                  placeholder="Phone Number">

              </div>


              <div
                class="model-error"
                id="pPhone-error">
              </div>

            </div>


            <div class="model-input-group">

              <label class="form-label"
                     for="pGrade">
                Grade
              </label>


              <select
                id="pGrade"
                class="model-select">

                <option value="">
                  Select Grade
                </option>

                <option value="LKG">
                  LKG
                </option>

                <option value="UKG">
                  UKG
                </option>

                <option value="1">
                  1st Class
                </option>

                <option value="2">
                  2nd Class
                </option>

                <option value="3">
                  3rd Class
                </option>

                <option value="4">
                  4th Class
                </option>

                <option value="5">
                  5th Class
                </option>

                <option value="6">
                  6th Class
                </option>

                <option value="7">
                  7th Class
                </option>

                <option value="8">
                  8th Class
                </option>

                <option value="9">
                  9th Class
                </option>

                <option value="10">
                  10th Class
                </option>

                <option value="11">
                  11th Class
                </option>

                <option value="12">
                  12th Class
                </option>

              </select>

            </div>

          </div>


          <div class="model-input-group">

            <label class="form-label"
                   for="pSyllabus">
              Syllabus
            </label>


            <select
              id="pSyllabus"
              class="model-select">

              <option value="">
                Select Syllabus
              </option>

              <option value="CBSE">
                CBSE
              </option>

              <option value="ICSE">
                ICSE
              </option>

              <option value="State">
                State Board
              </option>

              <option value="IGCSE">
                IGCSE
              </option>

            </select>

          </div>


          <div class="model-input-group">

            <label class="form-label"
                   for="pBio">
              Bio (Optional)
            </label>


            <textarea
              id="pBio"
              class="model-textarea"
              placeholder="Tell us about yourself..."></textarea>

          </div>


          <div
            class="model-message"
            id="pMessage">
          </div>


          <div class="form-actions">

            <button
              type="submit"
              class="model-submit">
              Save Changes
            </button>


            <button
              type="button"
              class="model-cancel"
              id="cancelBtn">
              Cancel
            </button>

          </div>


        </form>

      </div>

    </div>

  </main>

</div>


<script src="js/profile.js"></script>

</body>
</html>
