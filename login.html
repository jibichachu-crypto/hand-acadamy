<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Login — HAND IN HAND ACADEMY</title>

  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none';
             img-src 'self';
             style-src 'self';
             script-src 'self';
             connect-src 'self' http://localhost:8080;
             base-uri 'none';
             form-action 'none';
             object-src 'none';
             frame-ancestors 'none';
             referrer no-referrer;"
  >

  <meta
    http-equiv="X-Content-Type-Options"
    content="nosniff"
  >

  <link rel="stylesheet" href="css/base.css">
  <link rel="icon" type="image/png" href="img/logo.png">
</head>

<body class="auth-page">

  <a href="index.html" class="logo-corner">
    <img
      src="img/logo.png"
      alt="Logo"
      class="logo-img"
    >
  </a>

  <header class="topbar">
    <nav class="topnav">

      <a href="index.html" class="toplink">Home</a>

      <a href="tuitions.html" class="toplink">Tuitions</a>

      <a href="boards.html" class="toplink">Boards</a>

      <a href="reviews.html" class="toplink">Reviews</a>

      <div class="nav-more">
        <a href="#" class="toplink">More ▾</a>

        <div class="nav-more-menu">
          <a href="about.html">About Us</a>
          <a href="contact.html">Contact Us</a>
          <a href="blog.html">Blog</a>
        </div>
      </div>

      <a href="fees.html" class="toplink">Fees</a>

      <a href="register.html" class="toplink topbtn">
        Join Now
      </a>

    </nav>
  </header>

  <main class="model-wrap">

    <div class="model-card">

      <h2 class="model-title">
        Login to Your Account
      </h2>

      <form
        id="loginModelForm"
        novalidate
      >

        <div class="model-input-group">

          <input
            type="text"
            id="login"
            class="model-input"
            placeholder="Enter Your Email or Phone"
            required
            autocomplete="username"
            maxlength="255"
          >

          <div
            class="model-error"
            id="login-error"
          ></div>

        </div>

        <div class="model-input-group">

          <input
            type="password"
            id="password"
            class="model-input"
            placeholder="Enter Your Password"
            required
            minlength="8"
            maxlength="128"
            autocomplete="current-password"
          >

          <div
            class="model-error"
            id="password-error"
          ></div>

        </div>

        <div class="remember-row">

          <label class="remember-wrap">
            <input
              type="checkbox"
              id="remember"
            >
            Remember me
          </label>

          <a
            href="#"
            class="forgot-link"
          >
            Forgot password?
          </a>

        </div>

        <div
          class="model-message"
          id="form-message"
          aria-live="polite"
        ></div>

        <button
          type="submit"
          class="model-submit"
        >
          Login
        </button>

        <p class="auth-switch">
          Don't have an account?
          <a href="register.html">
            Create account
          </a>
        </p>

      </form>

    </div>

  </main>

  <footer class="bottombar">

    <a
      class="contact-line"
      href="handinhandonlineacademy@gmail.com"
    >
     handinhandonlineacademy@gmail.com
    </a>

  </footer>

  <script
    src="js/login.js"
    defer
  ></script>

</body>
</html>
