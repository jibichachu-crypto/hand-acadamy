<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — HAND IN HAND ACADEMY</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="icon" type="image/png" href="img/logo.png">
</head>
<body class="auth-page">
  <a href="index.html" class="logo-corner"><img src="img/logo.png" alt="Logo" class="logo-img"></a>
  <header class="topbar">
    <nav class="topnav">
      <a href="index.html" class="toplink">Home</a>
      <a href="tuitions.html" class="toplink">Tuitions</a>
      <a href="boards.html" class="toplink">Boards</a>
      <a href="reviews.html" class="toplink">Reviews</a>
      <div class="nav-more">
        <a href="#" class="toplink">More ▾</a>
        <div class="nav-more-menu">
          <a href="about.html">About Us</a>
          <a href="contact.html">Contact Us</a>
          <a href="blog.html">Blog</a>
        </div>
      </div>
      <a href="fees.html" class="toplink">Fees</a>
      <a href="login.html" class="toplink topbtn">Login</a>
    </nav>
  </header>

  <main class="model-wrap">
    <div class="model-card">
      <h2 class="model-title">Create Your Account</h2>

      <form id="registerModelForm" method="GET" action="login.html" novalidate>

        <div class="model-input-group">
          <input type="text" id="name" class="model-input" placeholder="Enter Your Name" required minlength="3" autocomplete="name">
          <div class="model-error" id="name-error"></div>
        </div>

        <div class="model-input-group">
          <input type="email" id="email" class="model-input" placeholder="Enter Your Email Address" required autocomplete="email">
          <div class="model-error" id="email-error"></div>
        </div>

        <div class="model-input-group">
          <div class="phone-group" id="phoneGroup">
            <select id="countryCode" class="country-select" required>
              <option value="+91" selected>🇮🇳 +91</option>
              <option value="+1">🇺🇸 +1</option>
              <option value="+44">🇬🇧 +44</option>
              <option value="+971">🇦🇪 +971</option>
              <option value="+966">🇸🇦 +966</option>
              <option value="+61">🇦🇺 +61</option>
              <option value="+65">🇸🇬 +65</option>
              <option value="+60">🇲🇾 +60</option>
              <option value="+49">🇩🇪 +49</option>
              <option value="+33">🇫🇷 +33</option>
              <option value="+81">🇯🇵 +81</option>
              <option value="+82">🇰🇷 +82</option>
              <option value="+86">🇨🇳 +86</option>
              <option value="+880">🇧🇩 +880</option>
              <option value="+94">🇱🇰 +94</option>
              <option value="+92">🇵🇰 +92</option>
              <option value="+977">🇳🇵 +977</option>
              <option value="+27">🇿🇦 +27</option>
            </select>
            <input type="tel" id="phone" class="phone-input" placeholder="Enter Your Phone Number" required inputmode="numeric">
          </div>
          <div class="model-error" id="phone-error"></div>
        </div>

        <div class="model-grid-2">
          <div class="model-input-group" style="margin-bottom:0;">
            <select id="grade" class="model-select" required>
              <option value="">Select Grade</option>
              <option value="6">Grade 6</option>
              <option value="7">Grade 7</option>
              <option value="8">Grade 8</option>
              <option value="9">Grade 9</option>
              <option value="10">Grade 10</option>
              <option value="11">Grade 11</option>
              <option value="12">Grade 12</option>
            </select>
            <div class="model-error" id="grade-error"></div>
          </div>
          <div class="model-input-group" style="margin-bottom:0;">
            <select id="syllabus" class="model-select" required>
              <option value="">Select Syllabus</option>
              <option value="CBSE">CBSE</option>
              <option value="ICSE">ICSE</option>
              <option value="State">State Board</option>
              <option value="IGCSE">IGCSE</option>
            </select>
            <div class="model-error" id="syllabus-error"></div>
          </div>
        </div>

        <div class="model-input-group">
          <input type="password" id="password" class="model-input" placeholder="Enter Your Password (Min 8 chars, 1 uppercase, 1 number)" required minlength="8" autocomplete="new-password">
          <div class="model-error" id="password-error"></div>
        </div>

        <div class="model-input-group">
          <input type="password" id="confirm" class="model-input" placeholder="Confirm Your Password" required minlength="8" autocomplete="new-password">
          <div class="model-error" id="confirm-error"></div>
        </div>

        <div class="agree-wrap">
          <input type="checkbox" id="agree" required>
          <span class="agree-text">I agree to the <a href="#">Terms</a> & <a href="#">Privacy Policy</a> *</span>
        </div>
        <div class="model-error" id="agree-error"></div>

        <div class="model-message" id="form-message"></div>

        <button type="submit" class="model-submit">Create Account</button>

        <p class="auth-switch">Already have an account? <a href="login.html">Login here</a></p>

      </form>
    </div>
  </main>

  <footer class="bottombar">
    <a class="contact-line" href="mailto:info@handinhandacademy.com">info@handinhandacademy.com</a>
    <span class="contact-sep">|</span>
    <a class="contact-line" href="tel:+919876543210">+91 98765 43210</a>
  </footer>

<script>
(function(){
  const form = document.getElementById('registerModelForm');
  const nameI = document.getElementById('name');
  const emailI = document.getElementById('email');
  const phoneI = document.getElementById('phone');
  const gradeI = document.getElementById('grade');
  const syllI = document.getElementById('syllabus');
  const pwdI = document.getElementById('password');
  const confirmI = document.getElementById('confirm');
  const agreeI = document.getElementById('agree');
  const msg = document.getElementById('form-message');

  function showErr(id, text){
    const el = document.getElementById(id);
    if(!el) return;
    el.textContent = text;
    el.classList.toggle('show', !!text);
  }
  function clearAll(){
    document.querySelectorAll('.model-error').forEach(e=>{ e.textContent=''; e.classList.remove('show'); });
    document.querySelectorAll('.model-input, .model-select, .phone-group').forEach(e=>e.classList.remove('input-error'));
  }

  form.addEventListener('submit', function(e){
    clearAll();
    let valid = true;

    const nameVal = nameI.value.trim();
    if(!nameVal){
      showErr('name-error','Name is required.');
      nameI.classList.add('input-error');
      valid = false;
    } else if(nameVal.length < 3){
      showErr('name-error','Name must be at least 3 characters.');
      nameI.classList.add('input-error');
      valid = false;
    } else if(!/^[A-Za-z ]+$/.test(nameVal)){
      showErr('name-error','Only letters and spaces allowed.');
      nameI.classList.add('input-error');
      valid = false;
    }

    const emailVal = emailI.value.trim();
    if(!emailVal){
      showErr('email-error','Email is required.');
      emailI.classList.add('input-error');
      valid = false;
    } else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal)){
      showErr('email-error','Enter a valid email address.');
      emailI.classList.add('input-error');
      valid = false;
    }

    const countryCode = document.getElementById('countryCode').value;
    const phoneVal = phoneI.value.trim();
    if(!phoneVal){
      showErr('phone-error','Phone number is required.');
      document.getElementById('phoneGroup').classList.add('input-error');
      valid = false;
    } else if(phoneVal.length < 7 || phoneVal.length > 15 || !/^\d+$/.test(phoneVal)){
      showErr('phone-error','Enter valid phone for ' + countryCode + ' (7-15 digits). 5 digit not allowed');
      document.getElementById('phoneGroup').classList.add('input-error');
      valid = false;
    } else if(countryCode === '+91' && !/^[6-9]\d{9}$/.test(phoneVal)){
      showErr('phone-error','Enter valid 10-digit Indian mobile (starts 6-9).');
      document.getElementById('phoneGroup').classList.add('input-error');
      valid = false;
    }

    if(!gradeI.value){
      showErr('grade-error','Please select a grade.');
      gradeI.classList.add('input-error');
      valid = false;
    }
    if(!syllI.value){
      showErr('syllabus-error','Please select a syllabus.');
      syllI.classList.add('input-error');
      valid = false;
    }

    const pwdVal = pwdI.value;
    if(!pwdVal){
      showErr('password-error','Password is required.');
      pwdI.classList.add('input-error');
      valid = false;
    } else if(pwdVal.length < 8){
      showErr('password-error','Min 8 characters required.');
      pwdI.classList.add('input-error');
      valid = false;
    } else if(!/[A-Z]/.test(pwdVal) || !/[0-9]/.test(pwdVal)){
      showErr('password-error','Min 8 chars + 1 uppercase + 1 number required.');
      pwdI.classList.add('input-error');
      valid = false;
    }

    const confVal = confirmI.value;
    if(!confVal){
      showErr('confirm-error','Please confirm password.');
      confirmI.classList.add('input-error');
      valid = false;
    } else if(pwdVal !== confVal){
      showErr('confirm-error','Passwords do not match.');
      confirmI.classList.add('input-error');
      valid = false;
    }

    if(!agreeI.checked){
      showErr('agree-error','You must agree to Terms & Privacy Policy.');
      valid = false;
    }

    if(!valid){
      e.preventDefault();
      msg.textContent = 'Please correct the errors above.';
      msg.className = 'model-message error show';
      msg.scrollIntoView({behavior:'smooth', block:'center'});
      return false;
    }

    try {
      localStorage.setItem('hih_user', JSON.stringify({
        name: nameVal, email: emailVal, countryCode: countryCode, phone: phoneVal, fullPhone: countryCode + ' ' + phoneVal, grade: gradeI.value, syllabus: syllI.value, at: new Date().toISOString()
      }));
    } catch(err){}
    msg.textContent = '✓ Registration successful! Redirecting to login...';
    msg.className = 'model-message success show';
  });

  [nameI, emailI, phoneI, pwdI, confirmI].forEach(inp=>{
    if(!inp) return;
    inp.addEventListener('input', ()=>{
      inp.classList.remove('input-error');
      const err = document.getElementById(inp.id + '-error');
      if(err){ err.textContent=''; err.classList.remove('show'); }
      if(inp.id==='phone') document.getElementById('phoneGroup').classList.remove('input-error');
    });
  });
})();
</script>
</body>
</html>
