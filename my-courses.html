<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'none';
      img-src 'self';
      style-src 'self';
      script-src 'self';
      connect-src 'self';
      base-uri 'none';
      form-action 'none';
      object-src 'none';
      frame-ancestors 'none';
      referrer no-referrer;
    "
  >

  <meta
    http-equiv="X-Content-Type-Options"
    content="nosniff"
  >

  <title>Courses — HAND IN HAND ACADEMY</title>

  <link
    rel="stylesheet"
    href="css/base.css"
  >

  <link
    rel="stylesheet"
    href="css/dashboard.css"
  >

  <link
    rel="icon"
    type="image/png"
    href="img/logo.png"
  >

</head>


<body class="dashboard">


  <header class="dash-topbar">

    <a
      href="dashboard.html"
      class="dash-brand"
    >
      HAND IN HAND ACADEMY
    </a>


    <nav class="dash-nav">

      <a
        href="logout.html"
        class="dash-link"
      >
        Logout
      </a>

    </nav>

  </header>


  <div class="dash-layout">


    <aside class="dash-sidebar">


      <div class="side-title">
        Main
      </div>


      <a
        href="my-courses.html"
        class="side-link active"
      >
        📚 Courses
      </a>


      <a
        href="dashboard.html"
        class="side-link"
      >
        ← Back
      </a>


      <div class="side-title">
        Account
      </div>


      <a
        href="profile.html"
        class="side-link"
      >
        👤 Profile
      </a>


      <a
        href="settings.html"
        class="side-link"
      >
        ⚙ Settings
      </a>


      <div class="side-title">
        Support
      </div>


      <button
        type="button"
        class="side-link"
        id="contactLink"
      >
        ✉ Contact
      </button>


      <a
        href="logout.html"
        class="side-link"
      >
        🚪 Logout
      </a>


    </aside>


    <main class="dash-main">


      <!-- COURSES -->

      <section id="coursesSection">


        <div class="welcome">

          <h2>
            My Courses 📚
          </h2>

          <p>
            Courses you have applied for.
          </p>

        </div>


        <h3 class="section-title">
          Applied Courses
        </h3>


        <div
          id="applicationsList"
          class="applications-list"
        >
        </div>


      </section>


      <!-- CONTACT -->

      <section
        id="contactSection"
        class="course-section hidden"
      >


        <div class="section-header">

          <h3 class="section-title">
            Contact Us
          </h3>


          <button
            type="button"
            class="close-section-btn"
            id="closeContactButton"
          >
            ✕ Close
          </button>

        </div>


        <div class="my-progress-card">

          <p>
            For enquiries and support, contact us at:
          </p>

          <p>
            <strong>
              handinhandonlineacademy@gmail.com
            </strong>
          </p>

        </div>


      </section>


    </main>

  </div>


  <script
    src="js/my-courses.js"
  ></script>


</body>
</html>
